# Section 4 — Supply chain.
# A conceptual schematic (6.1), then the per-material Sankey carousel (6.2),
# then the all-material system view (6.3). Together: where the chain pinches,
# material by material and overall.
id: supply-chain
class: longform--econ
blocks:

  # ── 5.1 Schematic: five stages from rock to product ─────────────────
  - type: prose
    id: supply-chain
    class: longform--econ
    eyebrow: "Section 5 &nbsp;·&nbsp; The supply chain"
    heading: "From rock to product"
    dropcap: true
    text: |
      Section 4 mapped the bottlenecks — where geology, industry and
      chemistry each lock the flow in place. To trace those locks in
      sequence, follow the chain. Every
      one of the focal materials travels through the same five stages
      between the ore body and the consumer product, and at each stage
      a different actor takes over.
      
  - type: figure
    src: visualizations/processing/ree_value_cliff.html
    alt: "Rare earth separation value cliff – price per kg by oxide"
    title: "REE separation value cliff"
    aria_label: "Rare earth separation value cliff"
    figure_number: "Figure 5.1"
    caption: |
      Estimated 2024 price per kilogram of the oxide form of six rare-earth
      elements drawn from the same family of mixed concentrates. The price spread 
      is roughly eight-hundred-fold – driven not by geology, but by the number of
      sequential separation stages each oxide requires.
      Source: USGS Mineral Commodity Summaries 2025.

  - type: prose
    class: longform--econ
    dropcap: false
    text: |

      The schematic below lays out those five stages with the actors
      and the leverage points named. The diagram does no statistics; it
      sets the vocabulary for the two data figures that follow.

  # ── 4.2 Per-material Sankey carousel ────────────────────────────────
  - type: prose
    class: longform--econ
    dropcap: false
    text: |
      Each card in the carousel below traces one material across two
      of those stages — country of mining on the left, country of
      processing on the right. Flow widths are share of global tonnage
      at each stage.

      **How to read each diagram.** Each Sankey has three columns. The
      left column lists *mining countries* — where the ore comes out of
      the ground. The right column lists *processing countries* — where
      it is refined into a usable industrial material. The two solid
      bars in the middle are the bridge between those stages: every
      tonne mined on the left passes through them and emerges in a
      different country mix on the right. The wider a band, the larger
      that country's share at that stage. Shifts between left and right
      are where the supply-chain bifurcation actually happens.

      Cobalt is the cleanest illustration: about 70 % of mined cobalt
      comes from a single country (the DRC, anchored by **Tenke
      Fungurume** in Lualaba — the single largest cobalt operation on
      Earth); 80 % of refined cobalt is processed in a different
      country (China). The metal physically travels several thousand
      miles between mine and refinery, and the value it carries rises
      by an order of magnitude over that distance.

      Step through the cards. Some look like cobalt — concentrated
      geology funnelled into a narrower processing stage. Some look
      stranger. Platinum's mining sits 70 % in South Africa but its
      processing fans out across seven countries with no single one
      above 50 %. Graphite is mined across China, Mozambique and
      Brazil, but every commercial-grade refined gram comes through
      Chinese facilities. Gallium is 98 % to 98 % at both stages —
      there is no second supplier on either side of the chain.

  - type: raw
