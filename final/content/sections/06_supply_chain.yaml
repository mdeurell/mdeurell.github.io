  # ── 5.3 All-material master Sankey ──────────────────────────────────
  - type: prose
    class: longform--econ
    dropcap: false
    text: |
      Each card in Figure 5.2 carried a different material; the chart below
      collapses all seven onto one canvas. Mining countries on the
      left, the seven material trunks in the centre, processing
      countries on the right. Each material contributes 100 units of
      flow on each side, so the canvas reads as <em>concentration of
      control</em> rather than physical tonnage — the question being
      asked is who decides each step.

      The visual answer is that one node on the right-hand side
      dominates almost every line entering it. China refines somewhere
      between 60 % and 100 % of every material in the panel except
      platinum, much of it through the **Bayan Obo** complex in Inner
      Mongolia for the rare-earth chain. The mining left side is
      comparatively diversified — DRC, Australia, Chile, South Africa,
      Peru, Russia all carry meaningful tonnage — but the mid-stream
      funnel is one country wide for almost everything.

      This is the structural answer to the question at the top of the
      report. Not "China owns the rocks" — China does not own the
      rocks — but <em>China owns the step that decides what the rocks
      are worth</em>.

  - type: figure
    src: visualizations/supply-chain/sankey_master.html
    alt: "All-material supply chain Sankey, 2023"
    title: "All-material supply chain Sankey, 2023"
    aria_label: "All-material supply chain Sankey"
    section_class: story-section--econ
    frame_class: master-sankey-frame
    figure_number: "Figure 5.3"
    caption: |
      All-material supply-chain Sankey, 2023, locked three-column
      layout. Left: top 10 mining countries by aggregate share across
      the seven materials, plus *Other countries* residual. Centre:
      the seven material trunks. Right: top 10 processing countries
      (after EU-27 grouping) plus *Other countries* residual. Each
      material is normalised to 100 units of flow on each side, so the
      canvas reads <em>control concentration</em>, not physical
      tonnage. China-bound links are tinted red so the chokepoint
      reads at a glance. Source: USGS <em>Mineral Commodity Summaries
      2025</em>; <em>Mining and Processing Fact Sheet</em> (Dataset E).
