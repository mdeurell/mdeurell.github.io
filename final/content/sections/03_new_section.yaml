# Section 3 – The Materials Value Chain: Where the Bottlenecks Sit.
# Replaces 003_attractive.yaml and 003_processing.yaml.
# Three supply-chain stages: Upstream (geological lock), Midstream (industrial
# and technical lock), Downstream (value capture and structural decoupling).
id: attractive
blocks:

  # ── Section opener ────────────────────────────────────────────────────
  - type: prose
    id: case-1
    eyebrow: "Section 3 &nbsp;·&nbsp; The materials value chain"
    heading: "Where the bottlenecks sit"
    dropcap: true
    text: |
      A deposit on a map is not the same as a functional supply. Between
      ore in the ground and usable material in a factory lies a chain of
      extraction, processing, and refinement – and that chain can concentrate
      in ways that geology never did. Three stages of that chain each carry a
      distinct kind of lock: geological, industrial, and chemical.
      Understanding which lock applies to which material determines what a
      realistic policy response looks like.

  # ── Upstream: The Geological Lock ────────────────────────────────────
  - type: prose
    eyebrow: "Upstream &nbsp;·&nbsp; The geological lock"
    heading: "The constraint no investment can dissolve"
    dropcap: true
    text: |
      For some materials, the constraint is written into the rock. The ore
      itself is rare, forming only under specific geological conditions that
      played out in a handful of places on Earth. No industrial build-out
      elsewhere changes this – the geology is the constraint. Whoever holds
      those deposits holds the leverage, regardless of what happens downstream.

      **Cobalt** is the clearest example. The Democratic Republic of Congo
      accounts for approximately 76% of global cobalt mine production – a
      consequence of the unique mineralogy of the Central African Copperbelt,
      a stratiform geological formation with no confirmed equivalent at
      comparable scale anywhere else. This is not policy or industrial choice;
      it is geography.

  - type: factbox
    heading: "Child Labor"
    tone: oxblood
    body: |
      <img src="images/child_labor_kailo_congo.jpg" alt="Child at artisan cobalt mine, Kailo, DRC" style="width:100%;max-height:160px;object-fit:cover;display:block;margin-bottom:0.75rem;">

      The **global green transition** and the demand for elegant EVs carry a hidden cost.
      In the Democratic Republic of Congo—which supplies the largest part of the world’s
      cobalt—children as young as four work 12-hour days in hazardous mines for a single
      dollar. For these children, the **cost of the world’s electrification** is their own
      education and safety.

      <small>Source: [Save the Children](https://www.savethechildren.net/stories/drc-cobalt-mines-child-labour-and-green-transition) · Photo: [Julien Harneis](https://commons.wikimedia.org/wiki/File:Child_labor,_Artisan_Mining_in_Kailo_Congo.jpg) / [CC BY-SA 2.0](https://creativecommons.org/licenses/by-sa/2.0/)</small>

  - type: figure
    src: visualizations/attractive/concentration_type2.html
    alt: "Mining concentration for geologically scarce materials – stacked bars by country"
    title: "Mining concentration for geologically locked materials"
    aria_label: "Ore concentration by country"
    figure_number: "Figure 3.1"
    caption: |
      **Heavy rare earth elements** – Dysprosium and Terbium – present a
      related case. Ion-adsorption clay deposits, the specific laterite type
      that makes heavy REE recovery feasible at industrial scale, require
      millions of years of specific tropical weathering to develop. Even full 
      refining capacity built elsewhere would still require ore sourced from
      the same narrow geography.

  - type: prose
    text: |
      **Platinum** illustrates the category from a different angle: the
      Bushveld Igneous Complex in South Africa holds roughly 80% of global
      platinum reserves – a permanent geological fact. But here, unlike cobalt,
      the country that holds the ore largely controls its processing too. It is
      a useful reminder that a geological lock does not automatically mean
      supply insecurity – only that the leverage is geological rather than
      industrial.

  - type: factbox
    heading: "Seabed Mining"
    tone: oxblood
    body: |
      Norway has some of the **happiest people** on the planet, and they have created 
      much **wealth from oil** findings in the North Atlantic seabed. Today the western 
      world back up a new initiative by the Norwegian government to search for 
      **critical materials at the seabed**. The environmental consequences for the underwater 
      areas are yet poorly understood, according to environmental organisations like Greenpeace.
      Source: https://www.greenpeace.org/static/planet4-norway-stateless/2024/10/590e5a97-deep_sea_mining_in_the_arctic-report-v5.pdf

  - type: prose
    text: |
      For geologically locked materials, the honest policy response is not
      build more refining capacity. It is: **stockpile**, invest in **material
      substitution**, and accept **managed dependence** where no alternative exists.

# ── Midstream: The Industrial and Technical Lock ──────────────────────
  - type: prose
    eyebrow: "Midstream &nbsp;·&nbsp; The industrial and technical lock"
    heading: "Where the bottlenecks sit"
    dropcap: true
    text: |
      The midstream is where geology ends and industrial strategy begins. Raw
      ore must be converted into the chemically pure, correctly specified
      material that factories actually use – and that conversion can concentrate
      just as decisively as geology, through two distinct mechanisms: deliberate
      industrial capture and extreme technical difficulty.

  - type: prose
    dropcap: false
    text: |
      **Industrial capture.** Copper is mined on five continents, yet more than
      40% of global refining capacity is found in a single country. Most lithium
      is extracted in Australia and South America, but the majority becomes
      battery-grade chemicals in facilities elsewhere. Notably, Japan refines
      nearly 6% of global copper despite mining essentially none of it.
      Industrial capture does not require geological ownership – it requires
      infrastructure, geopolitical strategy, and decades of accumulated
      investment.

  - type: factbox
    heading: "The Energy Toll"
    tone: oxblood
    body: |
      Securely bridging the purity gap requires a staggering energy investment 
      for a relatively small return of usable material. For Graphite, the battery 
      industry **requires 99.95% purity**, far above the 85–92% found in natural flakes. 
      Reaching this level requires **specialized furnaces reaching 3,000°C**. Similarly, 
      producing high-purity Copper involves heating impure metal to 2,000°C before 
      utilizing **non-recyclable chemical electrolytes** to strip away final impurities. 
      These processes demand vast amounts of power to secure the final fractions of 
      purity necessary for modern technology, leaving behind **hazardous waste** as the 
      price of industrial precision.
      https://emew.com/blog/liberating-copper-and-nickel-a-true-story

  - type: figure
    src: visualizations/attractive/slope_mining_vs_processing.html
    alt: "Mining share vs. processing share – slope chart for Copper, Lithium, Graphite, and Rare Earths"
    title: "Mining share vs. processing share"
    aria_label: "Mining vs. processing slope chart"
    figure_number: "Figure 3.2"
    caption: |
      Mining share vs. processing share for four midstream-concentrated materials –
      Copper, Lithium, Graphite, Rare Earths. Each line tracks one country's
      position – where the ore comes from (left axis) to where it is
      refined (right axis). China lines climb on every panel.
      Sources: USGS Fact Sheet 2025-3038; USGS Mineral Commodity Summaries 2025.

  - type: prose
    text: |
      **The chemical lock.** Creating the permanent magnets essential for EV
      motors requires isolating individual rare earth elements from a mixed
      concentrate. Processors must navigate up to 1,500 distinct
      solvent-extraction stages – akin to separating a carton of mixed juice
      back into individual fruits – leaving behind vast tailings lakes of
      acidic waste. Getting from raw ore to 99.5% pure Nd₂O₃ represents a
      manufacturing challenge of the first order, and the price premium for
      doing so reflects it.

  - type: factbox
    heading: "Chemicals"
    tone: oxblood
    body: |
      The processes used to produce **rare earth magnets**, a super strong type of magnets 
      that is used intensively in EVs and wind turbines is an **environmental risk**. 
      Separation of rare earths from ore can be described as having multi fruits juice 
      that is divided into apple juice and orange juice. These processes can go through 
      **more than 1500 chemical processes**. The leftovers can best be described as waste 
      lake banks with a huge **negative environmental effect**.
      Source: https://www.chathamhouse.org/2026/03/rare-earths-race-risks-environmental-disaster

  - type: prose
    text: |
      The midstream response requires massive capital investment in processing
      infrastructure and long-term R&D into chemical separation – a timeline
      measured in decades, not years.

  # ── Downstream: The Finished Product ────────────────────────────────────
  - type: prose
    id: case-2
    eyebrow: "Downstream &nbsp;·&nbsp; The finished product"
    heading: "Who captures the extraction risk — and who captures the value"
    dropcap: true
    text: |
      The downstream is where refined material meets the factory floor. This
      stage reveals a structural decoupling that runs through nearly every
      material in this study: the countries and companies that bear the risks
      of extraction rarely capture the market value of the finished product.

  - type: factbox
    heading: "The Cobalt Trap"
    tone: oxblood
    body: |
      **DRC mines 76%** of global cobalt as crude hydroxide – bearing the
      extraction risk, the environmental cost, and the human toll. The material
      ships out as a partially processed export. **China refines 80%** of it
      into battery-grade salts and metal. Refined cobalt then flows to cathode
      and battery manufacturers worldwide.

      The ore-holder earns the extraction risk. The refiner captures the value.


  - type: prose
    text: |
      The same structural logic applies to rare earths. A single ore body – a
      mixed rare-earth concentrate – yields finished oxides ranging from a few
      dollars per kilogram for common elements like cerium, to more than $800
      per kilogram for terbium. That spread is not scarcity. It is separation:
      the price premium is the cost of technical stamina, paid at the refining
      stage.

  - type: prose
    text: |
      The downstream response is vertical integration – controlling the full
      chain from mine to finished product – or product redesign to reduce
      reliance on the most volatile midstream chemicals.

  - type: factbox
    heading: "Downstream Energy Consumption"
    tone: oxblood
    body: |
      While the energy used to transport critical materials is **difficult to quantify**, 
      the scale of the task is growing; copper demand alone is expected to hit 
      **3.5 MT by 2035**. Most of this volume will require intensive energy for mining, 
      refining, and supply-chain logistics. This embedded **energy is a critical factor** 
      in the overall footprint of the green transition. While the critical material 
      is energy heavy to get out of the ground and process, the use of products might have 
      a significant impact on **the worlds energy consumption** for many years to come.
      Source: https://www.ief.org/_resources/files/reports/a-critical-minerals-enabled-energy-future.pdf
      
