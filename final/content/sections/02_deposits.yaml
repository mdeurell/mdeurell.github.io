  - type: prose
    eyebrow: "Section 2 &nbsp;·&nbsp; Nine mines that shape the world"
    heading: "The landmark sites, one by one"
    dropcap: false
    text: |
      The map's stars mark nine landmark mines — operating, idled, or
      blocked — that together carry an outsized share of the global
      narrative for critical materials. Each tells a different version of
      the same lesson: the deposit is rarely the bottleneck.

      ### Bayan Obo &nbsp;—&nbsp; China, Inner Mongolia · Active
      *Neodymium · carbonatite-hosted iron-REE*

      The backbone of China's rare-earth dominance. Scale is unmatched
      — the processing city built around it is why China controls
      roughly 90% of global REE refining. Also a major iron-ore
      operation. Produces primarily light REE (La, Ce, Pr, Nd).

      ### Mountain Pass &nbsp;—&nbsp; United States, California · Active
      *Neodymium · carbonatite* 

      Supplied most of the Western world's REE through the 1980s, then
      closed in 2002 when China undercut prices. Reopened in 2017 under
      MP Materials. Still ships concentrate to China for separation —
      domestic processing capacity is under construction.

      ### Mt Weld &nbsp;—&nbsp; Australia, Western Australia · Active
      *Neodymium · supergene-enriched carbonatite*

      The main non-Chinese supplier of separated rare-earth products to
      Western markets. World's highest-grade REE deposit (two to three
      times Bayan Obo). Ore is shipped to Lynas' processing plant in
      Malaysia for separation. Critical to any Western supply-chain
      diversification strategy.

      ### Nolans Bore &nbsp;—&nbsp; Australia, Northern Territory · Development
      *Neodymium · phosphate-REE apatite vein*

      Largest undeveloped NdPr project in the Western pipeline. REE is
      hosted in apatite — a phosphate mineral — alongside uranium,
      requiring complex processing. Feasibility completed 2023; now in
      financing. If built, would add roughly 10% to non-Chinese NdPr
      supply.

      ### Kvanefjeld &nbsp;—&nbsp; Greenland, Ilimaussaq complex · Blocked
      *Dysprosium · peralkaline igneous intrusion*

      Largest undeveloped heavy-REE deposit globally — currently
      inaccessible. License revoked in 2021 by the Greenlandic
      government over opposition to uranium co-mining. A textbook case
      of environmental and political barriers locking out a major
      strategic deposit.

      ### Bou Azzer &nbsp;—&nbsp; Morocco, Anti-Atlas Mountains · Active
      *Cobalt · cobaltite-arsenide hydrothermal vein*

      The world's oldest continuously operating cobalt mine — running
      since the 1930s. Most cobalt globally is a byproduct of copper or
      nickel; Bou Azzer is rare in producing it as the primary product,
      giving Western buyers a supply option independent of DRC politics.

      ### Tenke Fungurume &nbsp;—&nbsp; DRC, Lualaba Province · Active
      *Cobalt · stratiform Cu-Co (Copperbelt)*

      The single largest cobalt producer on Earth — about 15% of global
      annual supply. Originally Western-owned (Freeport-McMoRan +
      Lundin), sold to Chinese CMOC in 2016. CMOC doubled output in
      2022–23, flooding the cobalt market and suppressing prices. A
      focal point of the supply-chain geopolitics story.

      ### Pilgangoora &nbsp;—&nbsp; Australia, Pilbara · Active
      *Lithium · spodumene pegmatite*

      Textbook Case 1 supply chain: Australia mines the ore, China
      refines it. Crushed and shipped as concentrate to Chinese
      converters who process it into lithium hydroxide for battery
      cathodes.

      ### Atacama Salt Flat &nbsp;—&nbsp; Chile, Atacama Desert · Active
      *Lithium · salar brine evaporite*

      World's largest lithium resource — about 30% of global production
      and the lowest-cost source globally (~$3,000/t LCE). Brine is
      pumped from underground aquifers and solar-evaporated over 12–18
      months in vast ponds, then processed into lithium carbonate. Part
      of the Lithium Triangle (Chile, Argentina, Bolivia) holding
      roughly 60% of global lithium resources.
