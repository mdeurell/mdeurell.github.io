# Section 2 — Where they are. Prose + global deposits map (Figure 2).
id: deposits
blocks:
  - type: prose
    id: deposits
    eyebrow: "Section 2 &nbsp;·&nbsp; Where they are"
    heading: "Geography is not the bottleneck"
    dropcap: true
    text: |
      The raw materials for the energy transition exist on every continent.
      Africa, South America, North America, Australia, and Asia all hold
      significant deposits of the ten elements profiled in the previous
      section. The geological story is one of **abundance and breadth**,
      not scarcity. Critical materials are critical not because the rocks
      are missing, but because the systems built on top of those rocks —
      mines, refineries, separation plants, trade contracts — have over
      decades collapsed into a handful of dominant hubs.

      A country that mines a material does not automatically capture its
      value. And a country with no mines at all can still dominate the
      supply chain if it controls the refining step. The pattern repeats
      across nearly every material in this study: **deposits are
      everywhere; chokepoints are not**.

      The world map below plots **13,723 known deposit locations**
      drawn from the United States Geological Survey's Critical Minerals
      Geodatabase and the Global Rare Earth Element Occurrence Database.
      Each point is a documented occurrence — anything from a small
      historic prospect to a producing mine. Use the layer panel to
      filter by mineral, switch between dot view and density heatmap, or
      isolate light and heavy rare earth subgroups.

      The visual takeaway is the same whichever filter is selected. The
      dots fan out across six continents. The story this project chases
      starts where the map ends — in the refineries, the long-term
      offtake contracts and the trade networks that decide which of these
      deposits ever reach a finished product.

